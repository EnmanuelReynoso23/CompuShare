[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compushare"
version = "0.1.0"
description = "CompuShare: La computadora compartida - Red distribuida de inferencia y computo para IA"
readme = "README.md"
authors = [{ name = "Enmanuel Reynoso" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
directo = ["aiortc>=1.9.0"]
perfil = ["py-spy>=0.4.0"]

[project.scripts]
compushare = "compushare.cli:app"

# El paquete lleva las dos partes: la CLI (src/compushare) y la red que usa por debajo (fabric).
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["compushare*", "fabric*"]
exclude = ["fabric.pruebas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
