# ====================================================================
# Configuración de Apache HTTP Server para CompuShare Swarm
# Balanceo y Registro de Inferencia Distribuida (4 Laptops @ 50ms Ping)
# ====================================================================

ServerName rele.compushare.local
ServerAdmin admin@compushare.local

# Módulos requeridos
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so

<VirtualHost *:80>
    DocumentRoot "C:/Users/Recepcion/CompuShare/resultados_simulacion"
    
    # Formato de Log Estándar Apache Combinado con Latencia
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" compushare_combined
    
    CustomLog "C:/Users/Recepcion/CompuShare/resultados_simulacion/access.log" compushare_combined
    ErrorLog "C:/Users/Recepcion/CompuShare/resultados_simulacion/error.log"
    LogLevel info

    # Enrutamiento WebSocket para Nodos Trabajadores
    ProxyPass /ws/worker ws://127.0.0.1:8000/ws/worker
    ProxyPassReverse /ws/worker ws://127.0.0.1:8000/ws/worker

    # Endpoint OpenAI Compatible
    ProxyPass /v1/ http://127.0.0.1:8000/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:8000/v1/

    # Dashboard y Resultados Estáticos
    <Directory "C:/Users/Recepcion/CompuShare/resultados_simulacion">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
</VirtualHost>
